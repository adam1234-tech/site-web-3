<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لعبة Pac-Man</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: black;
      color: white;
      margin: 0;
      overflow: hidden;
    }
    canvas {
      display: block;
      margin: 20px auto;
      border: 2px solid #fff;
      background-color: #000;
    }
  </style>
</head>
<body>
  <h1>لعبة Pac-Man</h1>
  <canvas id="gameCanvas" width="600" height="400"></canvas>
  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // إعدادات اللعبة
    const gridSize = 20;
    const pacman = {
      x: gridSize * 2,
      y: gridSize * 2,
      radius: gridSize / 2,
      direction: "right",
      speed: gridSize,
      mouthOpen: true,
    };

    const food = [];
    const cols = canvas.width / gridSize;
    const rows = canvas.height / gridSize;

    for (let i = 0; i < 50; i++) {
      food.push({
        x: Math.floor(Math.random() * cols) * gridSize,
        y: Math.floor(Math.random() * rows) * gridSize,
      });
    }
    function drawMaze() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      
      food.forEach((dot) => {
        ctx.beginPath();
        ctx.arc(dot.x + gridSize / 2, dot.y + gridSize / 2, gridSize / 6, 0, Math.PI * 2);
        ctx.fillStyle = "yellow";
        ctx.fill();
        ctx.closePath();
      });
    }

    function drawPacman() {
      const startAngle = pacman.mouthOpen ? 0.2 : 0;
      const endAngle = pacman.mouthOpen ? 1.8 : 2;

      ctx.beginPath();
      ctx.arc(pacman.x + gridSize / 2, pacman.y + gridSize / 2, pacman.radius, Math.PI * startAngle, Math.PI * endAngle);
      ctx.lineTo(pacman.x + gridSize / 2, pacman.y + gridSize / 2);
      ctx.fillStyle = "yellow";
      ctx.fill();
      ctx.closePath();

      pacman.mouthOpen = !pacman.mouthOpen;
    }

    function updatePacman() {
      switch (pacman.direction) {
        case "right":
          pacman.x += pacman.speed;
          if (pacman.x >= canvas.width) pacman.x = 0;
          break;
        case "left":
          pacman.x -= pacman.speed;
          if (pacman.x < 0) pacman.x = canvas.width - gridSize;
          break;
        case "up":
          pacman.y -= pacman.speed;
          if (pacman.y < 0) pacman.y = canvas.height - gridSize;
          break;
        case "down":
          pacman.y += pacman.speed;
          if (pacman.y >= canvas.height) pacman.y = 0;
          break;
      }

      // أكل الطعام
      for (let i = 0; i < food.length; i++) {
        if (
          Math.abs(pacman.x - food[i].x) < gridSize / 2 &&
          Math.abs(pacman.y - food[i].y) < gridSize / 2
        ) {
          food.splice(i, 1);
          break;
        }
      }
    }

    // التحكم في Pac-Man
    document.addEventListener("keydown", (event) => {
      switch (event.key) {
        case "ArrowUp":
          pacman.direction = "up";
          break;
        case "ArrowDown":
          pacman.direction = "down";
          break;
        case "ArrowLeft":
          pacman.direction = "left";
          break;
        case "ArrowRight":
          pacman.direction = "right";
          break;
      }
    });

    // تحديث اللعبة
    function updateGame() {
      updatePacman();
      drawMaze();
      drawPacman();
      if (food.length === 0) {
        alert("لقد أكلت كل الطعام! أحسنت!");
        document.location.reload();
      }
    }

    // تشغيل اللعبة
    setInterval(updateGame, 150);
  </script>
</body>
</html>
